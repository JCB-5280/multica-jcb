name: mato

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mato
      POSTGRES_USER: ${POSTGRES_USER:-mato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mato}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
